<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>鸭鸭日记本 · 教师端</title>
<link rel="icon" href="/assets/duck-front-favicon.png" type="image/png">
<link rel="stylesheet" href="/teacher/styles.css">
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>
<div class="layout teacher-shell">
  <aside class="teacher-sidebar">
    <div class="teacher-brand">
      <img class="teacher-logo" src="/assets/duck-front-logo.png" alt="">
      <span class="teacher-brand-copy">
        <span class="teacher-brand-name">鸭鸭日记本</span>
        <span class="teacher-brand-context">教师端</span>
      </span>
    </div>
    <nav class="nav" id="nav" aria-busy="true">
      <button data-v="today" disabled>今日任务</button>
      <button data-v="children" disabled>幼儿管理</button>
      <button data-v="ducks" disabled>小鸭管理</button>
      <button data-v="roster" disabled>值日排班</button>
      <button data-v="review" disabled>值日审阅</button>
      <button data-v="growth" disabled>能力成长曲线</button>
      <button data-v="search" disabled>明细检索</button>
    </nav>
    <p class="teacher-sidebar-note">仅限教师使用</p>
  </aside>
  <div class="teacher-stage">
    <header class="teacher-topbar">
      <p class="teacher-topbar-title">安全设置</p>
      <div class="teacher-topbar-actions"></div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<script src="/shared/api.js"></script>
<script src="/shared/auth.js"></script>
<script type="module" src="/teacher/app.js"></script>
</body>
</html>
